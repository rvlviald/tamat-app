<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7f3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tamat">
<title>Tamat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="library">
  <div class="wrap">
    <header class="lib-head">
      <h1>Reading</h1>
      <p id="today" class="quiet"></p>
    </header>
    <nav class="lib-actions" id="lib-actions">
      <button type="button" id="go-backup" class="chip">Backup</button>
    </nav>
    <div id="lib-body"></div>
    <div class="lib-foot"><button type="button" id="add" class="link">Add books</button></div>
  </div>
</main>

<section id="reader" aria-hidden="true">
  <div id="view">
    <canvas id="page"></canvas>
    <div id="epub"><div id="flow"></div></div>
  </div>
  <header id="top" class="glass">
    <button type="button" id="back" aria-label="Back to library">‹ Library</button>
    <button type="button" id="undo-btn" aria-label="Undo last step (Ctrl+Z)" title="Back to previous position (Ctrl+Z)" hidden>↶</button>
    <span id="rtitle"></span>
    <button type="button" id="mode" hidden></button>
    <button type="button" id="theme" aria-label="Change theme">Aa</button>
  </header>
  <footer id="bottom" class="glass">
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Reading position">
    <div class="row"><span id="where"></span><b id="left"></b></div>
  </footer>
  <div id="pill"></div>
  <div id="loading">Opening…</div>
  <div id="done" hidden>
    <div class="sheet glass">
      <h2>Tamat.</h2>
      <p id="done-text"></p>
      <button type="button" id="done-back" class="primary">Back to library</button>
      <button type="button" id="done-close" class="link">Close</button>
    </div>
  </div>
</section>

<div id="toast" role="status"></div>
<input id="file" type="file" accept=".pdf,.epub,application/pdf,application/epub+zip" multiple hidden>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
